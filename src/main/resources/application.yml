spring:
  application:
    name: hanjari
  # 접속 정보는 환경변수로만 받는다. 기본값을 두지 않아 다른 DB로 잘못 연결되지 않게 한다.
  datasource:
    url: ${HANJARI_DB_URL}
    username: ${HANJARI_DB_USERNAME}
    password: ${HANJARI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  # HJ-003: 서버 세션은 JDBC에 저장한다. 세션 테이블은 Flyway(V2)가 만든다. 유휴 만료 30분.
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m

# 상태 변경 요청(POST/PUT/PATCH/DELETE)에 허용하는 로컬 Origin. 정확히 일치해야 한다.
hanjari:
  security:
    allowed-origins: http://localhost:8080
  # HJ-006: 만료 확보 정리 작업자. 정합성은 작업자에 의존하지 않는다(확보·해제·조회가 만료를 다시 판정한다).
  holds:
    expiry-worker:
      enabled: true
      interval-ms: 1000

logging:
  level:
    # 인증 실패·접근 거부·원시 입력을 기록하지 않는다. 보안 debug 로그를 켜지 않는다.
    org.springframework.security: WARN
